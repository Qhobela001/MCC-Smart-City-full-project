name: Build and push Docker images

on:
  push:
    branches: [ main, feature/dockerize ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: secrets.DOCKERHUB_USERNAME == ''
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (Docker Hub)
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v4
        with:
          context: ./mcc-smart-city-backend
          file: ./mcc-smart-city-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mcc-smart-city-backend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/mcc-smart-city-backend:latest

      - name: Build and push backend (GHCR)
        if: secrets.DOCKERHUB_USERNAME == ''
        uses: docker/build-push-action@v4
        with:
          context: ./mcc-smart-city-backend
          file: ./mcc-smart-city-backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcc-smart-city-backend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/mcc-smart-city-backend:latest

      - name: Build and push frontend (Docker Hub)
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v4
        with:
          context: ./mcc-smart-city-frontend
          file: ./mcc-smart-city-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mcc-smart-city-frontend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/mcc-smart-city-frontend:latest

      - name: Build and push frontend (GHCR)
        if: secrets.DOCKERHUB_USERNAME == ''
        uses: docker/build-push-action@v4
        with:
          context: ./mcc-smart-city-frontend
          file: ./mcc-smart-city-frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcc-smart-city-frontend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/mcc-smart-city-frontend:latest
