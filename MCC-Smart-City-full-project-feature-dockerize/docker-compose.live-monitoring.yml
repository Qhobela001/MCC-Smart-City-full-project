services:
  backend:
    environment:

      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WEBRTC_PUBLIC_URL: ${MEDIAMTX_WEBRTC_PUBLIC_URL:-http://localhost:8889}
      LIVE_STREAM_TOKEN_SECRET: ${LIVE_STREAM_TOKEN_SECRET:-}
      LIVE_STREAM_TOKEN_TTL_SECONDS: ${LIVE_STREAM_TOKEN_TTL_SECONDS:-300}

      CAMERA_GATEWAY_SHARED_KEY: ${CAMERA_GATEWAY_SHARED_KEY}
      CAMERA_GATEWAY_CONTROL_URL: http://camera-gateway:8090
      LIVE_STREAM_PUBLISH_USERNAME: ${LIVE_STREAM_PUBLISH_USERNAME}
      LIVE_STREAM_PUBLISH_PASSWORD: ${LIVE_STREAM_PUBLISH_PASSWORD}

      # Stage AI-0: internal machine authentication for detection ingestion.
      # The AI worker must never reuse a dashboard user's JWT.
      AI_WORKER_SHARED_KEY: ${AI_WORKER_SHARED_KEY:-}
      AI_INGEST_ACTOR_EMAIL: ${AI_INGEST_ACTOR_EMAIL:-admin@mcc.org.ls}

      # Stage 4: one stable server-side key encrypts all camera passwords at rest.
      # Keep this value stable across restarts/backups; never expose it to frontend.
      CAMERA_CREDENTIAL_MASTER_KEY: ${CAMERA_CREDENTIAL_MASTER_KEY:-}

      # Legacy V380 fallback retained only for migration. Once a camera shows
      # credential_source=vault and the gateway is verified, its per-camera env
      # variable can be removed in the hardening stage.
      # Default V380 LAN credentials. Individual cameras can continue using
      # credential_reference when they require different credentials.
      V380_DEFAULT_USERNAME: ${V380_DEFAULT_USERNAME:-admin}
      V380_DEFAULT_PASSWORD: ${V380_DEFAULT_PASSWORD:-}
    depends_on:
      - mediamtx
    networks:
      - mcc-network

  frontend:
    depends_on:
      - mediamtx
    networks:
      - mcc-network

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTSP 8554 remains internal to the Docker network. Publishers are
      # camera-gateway workers, not arbitrary LAN clients.
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    networks:
      - mcc-network

  camera-gateway:
    build:
      context: ./macrovideo_client
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    environment:
      MCC_CAMERA_REGISTRY_URL: http://backend:8000/api/v1/live-streams/gateway/cameras
      CAMERA_GATEWAY_SHARED_KEY: ${CAMERA_GATEWAY_SHARED_KEY}
      CAMERA_GATEWAY_CONTROL_PORT: ${CAMERA_GATEWAY_CONTROL_PORT:-8090}

      MEDIAMTX_RTSP_BASE_URL: rtsp://mediamtx:8554
      LIVE_STREAM_PUBLISH_USERNAME: ${LIVE_STREAM_PUBLISH_USERNAME}
      LIVE_STREAM_PUBLISH_PASSWORD: ${LIVE_STREAM_PUBLISH_PASSWORD}

      CAMERA_REGISTRY_POLL_SECONDS: ${CAMERA_REGISTRY_POLL_SECONDS:-10}
      CAMERA_RECONNECT_SECONDS: ${CAMERA_RECONNECT_SECONDS:-5}
      V380_LIVE_SOCKET_TIMEOUT: ${V380_LIVE_SOCKET_TIMEOUT:-2}
      V380_LIVE_IDLE_TIMEOUT: ${V380_LIVE_IDLE_TIMEOUT:-20}
      V380_DEFAULT_FPS: ${V380_DEFAULT_FPS:-12}
      FFMPEG_LOG_LEVEL: ${FFMPEG_LOG_LEVEL:-warning}
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - mcc-network

  # Stage AI-1 is opt-in and one-shot. It cannot start during normal `up`.
  # Invoke it explicitly with `--profile ai-test run --rm ai-worker ...`.
  ai-worker:
    profiles: ["ai-test"]
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    environment:
      AI_BACKEND_URL: http://backend:8000/api/v1/ai-detections/ingest/batch
      AI_WORKER_SHARED_KEY: ${AI_WORKER_SHARED_KEY:-}
      AI_MODEL_PATH: /models/mcc_detector_v1.pt
      AI_MODEL_SHA256: ${AI_MODEL_SHA256:-845026048d3bb44831b069cbc36e189bb0fc0bbcff4f4445b8fcab382359d9af}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-mcc_detector_v1}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-v1}
      AI_CONFIDENCE: ${AI_CONFIDENCE:-0.25}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-640}
      AI_VIDEO_SAMPLE_SECONDS: ${AI_VIDEO_SAMPLE_SECONDS:-1.0}
      AI_REQUEST_ATTEMPTS: ${AI_REQUEST_ATTEMPTS:-3}
      AI_HEALTH_PATH: /output/health.json
    volumes:
      - ${AI_MODEL_PATH:-./ai_worker/model_weights/mcc_detector_v1.pt}:/models/mcc_detector_v1.pt:ro
      - ./ai_worker/input:/input:ro
      - ./ai_worker/output:/output
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mcc-network

  # Stage AI-2: explicitly selected, observation-only live stream analysis.
  # This profile is never enabled by ordinary application startup.
  ai-live-observer:
    profiles: ["ai-live-test"]
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["--live"]
    environment:
      AI_BACKEND_URL: http://backend:8000/api/v1/ai-detections/ingest/batch
      AI_WORKER_SHARED_KEY: ${AI_WORKER_SHARED_KEY:-}
      AI_MODEL_PATH: /models/mcc_detector_v1.pt
      AI_MODEL_SHA256: ${AI_MODEL_SHA256:-845026048d3bb44831b069cbc36e189bb0fc0bbcff4f4445b8fcab382359d9af}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-mcc_detector_v1}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-v1}
      AI_CONFIDENCE: ${AI_CONFIDENCE:-0.25}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-640}
      AI_REQUEST_ATTEMPTS: ${AI_REQUEST_ATTEMPTS:-3}
      AI_LIVE_CAMERA_IDENTIFIER: ${AI_LIVE_CAMERA_IDENTIFIER:-}
      AI_LIVE_SESSION_URL_TEMPLATE: http://backend:8000/api/v1/live-streams/ai/cameras/{camera_identifier}/session
      AI_LIVE_RTSP_BASE_URL: rtsp://mediamtx:8554
      AI_LIVE_SAMPLE_SECONDS: ${AI_LIVE_SAMPLE_SECONDS:-2.0}
      AI_LIVE_RECONNECT_MIN_SECONDS: ${AI_LIVE_RECONNECT_MIN_SECONDS:-2.0}
      AI_LIVE_RECONNECT_MAX_SECONDS: ${AI_LIVE_RECONNECT_MAX_SECONDS:-30.0}
      AI_LIVE_TOKEN_REFRESH_SECONDS: ${AI_LIVE_TOKEN_REFRESH_SECONDS:-30.0}
      AI_LIVE_HEALTH_PATH: /output/live-health.json
      AI_QUALIFICATION_ENABLED: ${AI_QUALIFICATION_ENABLED:-true}
      AI_QUALIFICATION_AUDIT_PATH: /output/qualification-audit.jsonl
      AI_QUALIFICATION_MIN_HITS: ${AI_QUALIFICATION_MIN_HITS:-3}
      AI_QUALIFICATION_MAX_GAP_SECONDS: ${AI_QUALIFICATION_MAX_GAP_SECONDS:-8.0}
      AI_QUALIFICATION_CONTEXT_WINDOW_SECONDS: ${AI_QUALIFICATION_CONTEXT_WINDOW_SECONDS:-10.0}
      AI_QUALIFICATION_COOLDOWN_SECONDS: ${AI_QUALIFICATION_COOLDOWN_SECONDS:-60.0}
    volumes:
      - ${AI_MODEL_PATH:-./ai_worker/model_weights/mcc_detector_v1.pt}:/models/mcc_detector_v1.pt:ro
      - ./ai_worker/output:/output
    healthcheck:
      test: ["CMD", "python", "-m", "mcc_ai_worker.healthcheck", "/output/live-health.json", "30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - mcc-network
