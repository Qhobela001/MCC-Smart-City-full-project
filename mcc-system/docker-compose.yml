version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcc_smart_city
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./mcc-smart-city-backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      PORT: 4000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mcc_smart_city
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./mcc-smart-city-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'

volumes:
  db_data:
